<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Uploader</title>
    <link rel="stylesheet" href="test_4_css_cod.css">
</head>
<body>
    <div class="container">
        <h1>upload</h1>
        <button id="openFileButton">Open File Explorer</button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <div class="image-display">
            <img id="displayImage" src="" alt="Selected Image" style="display: none;">
            <p id="imagePlaceholder">No image selected</p>
        </div>
    </div>
    <script src="test_4_js_code.js"></script>
</body>
</html>
